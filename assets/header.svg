<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Segoe UI, Ubuntu, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79ff97"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2430" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#79ff97" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#79ff97" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>

  <!-- graph motif: nodes + edges -->
  <g stroke="#2d3b4a" stroke-width="1.5">
    <line x1="880" y1="80" x2="980" y2="130"/>
    <line x1="980" y1="130" x2="1090" y2="90"/>
    <line x1="980" y1="130" x2="950" y2="220"/>
    <line x1="950" y1="220" x2="1070" y2="210"/>
    <line x1="1090" y1="90" x2="1070" y2="210"/>
    <line x1="880" y1="80" x2="820" y2="170"/>
    <line x1="820" y1="170" x2="950" y2="220"/>
  </g>
  <g>
    <circle cx="880" cy="80" r="6" fill="#00d4ff"/>
    <circle cx="980" cy="130" r="10" fill="#79ff97"/>
    <circle cx="980" cy="130" r="18" fill="none" stroke="#79ff97" stroke-opacity="0.35"/>
    <circle cx="1090" cy="90" r="6" fill="#ff6b35"/>
    <circle cx="950" cy="220" r="7" fill="#00d4ff"/>
    <circle cx="1070" cy="210" r="5" fill="#79ff97"/>
    <circle cx="820" cy="170" r="5" fill="#ff6b35"/>
  </g>

  <text x="70" y="104" fill="#8b949e" font-size="20" font-family="SFMono-Regular, Consolas, Menlo, monospace">$ whoami</text>
  <text x="66" y="170" fill="#ffffff" font-size="64" font-weight="700">Rishi Raj</text>
  <rect x="70" y="190" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="70" y="232" fill="#c9d1d9" font-size="22">Open source · Systems in Go · Machine Learning</text>
  <text x="70" y="262" fill="#8b949e" font-size="17">LFX Mentee (CNCF) · Ex-Meshery Maintainer · CS &amp; AI @ Newton School of Technology</text>
</svg>
